<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RevM² — Reminders</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c8a96e">
<link rel="stylesheet" href="src/styles/pages/telegram.css">
</head>
<body>
<canvas id="starfield"></canvas>
<div class="orb"></div>

<div class="page-center" style="align-items:flex-start;text-align:left;">
  <div class="tg-wrap">
    <a class="tg-back" href="tracker.html">← Back to tracker</a>
    <div class="rm2-logo" data-size="nav" style="margin-bottom:1.1rem;"></div>

    <div class="card">
      <div class="card-body">
        <div class="tg-icon"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0;filter:drop-shadow(0 0 3px rgba(212,175,55,0.45))"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6.5H4c.5-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></div>
        <div class="tg-status" id="tgStatus"><span class="dot-status off" id="tgDot"></span><span id="tgStatusTxt">Checking status…</span></div>
        <p class="tg-desc">Get your revision reminders sent straight to Telegram — due reviews, daily nudges, and streak alerts. No spam, you can disconnect anytime.</p>

        <button class="btn btn-gold" id="connectBtn" style="width:100%;display:none;" onclick="connectTelegram()">Connect Telegram →</button>
        <button class="btn btn-ghost" id="reconnectBtn" style="width:100%;display:none;" onclick="connectTelegram()">Open Telegram again</button>

        <div class="tg-row" id="reminderRow" style="display:none;">
          <div>
            <div class="tg-row-label">Reminders enabled</div>
            <div class="tg-row-sub">Turn off to pause notifications without disconnecting</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="remindersToggle" onchange="toggleReminders(this.checked)">
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="tg-msg" id="tgMsg"></div>
      </div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(REVM2_CONFIG.SUPABASE_URL, REVM2_CONFIG.SUPABASE_ANON);
const BOT_USERNAME = 'revm2_bot'; // from @BotFather
let currentUser = null;

function setMsg(text, isErr){
  const el = document.getElementById('tgMsg');
  el.textContent = text || '';
  el.className = 'tg-msg' + (isErr ? ' err' : '');
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  currentUser = session.user;
  RevM2Calls.init(sb, currentUser.id);
  RevM2Notifications.init(sb, currentUser.id);

  const { data: profile, error } = await sb.from('user_profiles')
    .select('telegram_linked,reminders_enabled')
    .eq('id', currentUser.id).single();

  if(error){ setMsg('Could not load your settings. Refresh to try again.', true); return; }

  renderStatus(profile);
}

function renderStatus(profile){
  const dot = document.getElementById('tgDot');
  const txt = document.getElementById('tgStatusTxt');
  const connectBtn = document.getElementById('connectBtn');
  const reconnectBtn = document.getElementById('reconnectBtn');
  const row = document.getElementById('reminderRow');
  const toggle = document.getElementById('remindersToggle');

  if(profile?.telegram_linked){
    dot.className = 'dot-status on';
    txt.textContent = 'Telegram connected';
    connectBtn.style.display = 'none';
    reconnectBtn.style.display = 'block';
    row.style.display = 'flex';
    toggle.checked = profile.reminders_enabled !== false;
  } else {
    dot.className = 'dot-status off';
    txt.textContent = 'Telegram not connected';
    connectBtn.style.display = 'block';
    reconnectBtn.style.display = 'none';
    row.style.display = 'none';
  }
}

function connectTelegram(){
  // Deep link carries the user's id as the /start payload so the bot
  // (via the n8n workflow) knows which Supabase row to attach the chat_id to.
  const link = `https://t.me/${BOT_USERNAME}?start=${currentUser.id}`;
  window.open(link, '_blank');
  setMsg('Opened Telegram — send /start to the bot, then come back here.');

  // Poll briefly for the link to land, since the bot writes telegram_linked
  // asynchronously once the user hits /start.
  let tries = 0;
  const poll = setInterval(async () => {
    tries++;
    const { data: profile } = await sb.from('user_profiles')
      .select('telegram_linked,reminders_enabled').eq('id', currentUser.id).single();
    if(profile?.telegram_linked){
      clearInterval(poll);
      setMsg('Telegram connected ✅');
      logEvent('telegram_connected');
      renderStatus(profile);
    } else if(tries >= 20){ // ~60s
      clearInterval(poll);
    }
  }, 3000);
}

async function toggleReminders(enabled){
  setMsg('');
  const { error } = await sb.from('user_profiles')
    .update({ reminders_enabled: enabled }).eq('id', currentUser.id);
  if(error){
    setMsg('Could not save — try again.', true);
    document.getElementById('remindersToggle').checked = !enabled;
  } else {
    setMsg(enabled ? 'Reminders turned on.' : 'Reminders paused.');
  }
}

init();
initStarfield();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
