        <svg class="oauth-icon" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg">

        </svg>
        <span class="oauth-label">Continue with Discord</span>
        <div class="btn-spinner"></div>
      </button>

      <button class="btn-oauth btn-github" data-provider="github" onclick="signInOAuth('github')">
        <svg class="oauth-icon" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.11.79-.25.79-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.34-1.28-1.69-1.28-1.69-1.04-.72.08-.7.08-.7 1.16.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11 11 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.21-1.49 3.18-1.18 3.18-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .31.21.67.8.55A10.53 10.53 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
        </svg>
        <span class="oauth-label">Continue with GitHub</span>
        <div class="btn-spinner"></div>
      </button>

      <button class="btn-oauth btn-facebook" data-provider="facebook" onclick="signInOAuth('facebook')">
        <svg class="oauth-icon" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07z"/>
        </svg>
        <span class="oauth-label">Continue with Facebook</span>
        <div class="btn-spinner"></div>
      </button>

      <button class="btn-oauth btn-telegram" id="telegramBtn" data-provider="telegram" onclick="signInTelegram()">
        <svg class="oauth-icon" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.05 2.5 2.9 9.98c-1.3.53-1.3 1.27-.24 1.6l4.9 1.53 1.9 5.83c.23.63.4.88.82.88.42 0 .6-.19.83-.42l1.98-1.92 4.11 3.04c.76.42 1.3.2 1.5-.7l2.72-12.83c.3-1.24-.34-1.83-1.37-1.49zM7.87 12.4l9.13-5.76c.43-.26.82-.12.5.17l-7.61 6.87-.3 3.24-1.72-4.52z"/>
        </svg>
        <span class="oauth-label">Continue with Telegram</span>
        <div class="btn-spinner"></div>
      </button>

      <div class="oauth-divider"><span>or</span></div>
      <button class="email-toggle" onclick="showView('signin')">Continue with email</button>
    </div>

    <!-- ── Email + password: sign in ── -->
    <div class="login-view" id="viewSignin">
      <form class="email-form" onsubmit="return emailSignIn(event)">
        <div class="field"><label>Email</label><input type="email" id="siEmail" autocomplete="email" required></div>
        <div class="field"><label>Password</label><input type="password" id="siPassword" autocomplete="current-password" required></div>
        <button class="btn-primary-full" type="submit" id="siBtn">Sign in</button>
        <div class="email-form-links">
          <button type="button" onclick="showView('forgot')">Forgot password?</button>
          <button type="button" onclick="showView('signup')">Create account</button>
        </div>
      </form>
      <button class="email-toggle" style="margin-top:1rem;" onclick="showView('oauth')">← Back</button>
    </div>

    <!-- ── Email + password: sign up ── -->
    <div class="login-view" id="viewSignup">
      <form class="email-form" onsubmit="return emailSignUp(event)">
        <div class="field"><label>Email</label><input type="email" id="suEmail" autocomplete="email" required></div>
        <div class="field"><label>Password</label><input type="password" id="suPassword" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label>Confirm password</label><input type="password" id="suPassword2" autocomplete="new-password" minlength="6" required></div>
        <button class="btn-primary-full" type="submit" id="suBtn">Create account</button>
        <div class="email-form-links" style="justify-content:center;">
          <button type="button" onclick="showView('signin')">Already have an account? Sign in</button>
        </div>
      </form>
      <button class="email-toggle" style="margin-top:1rem;" onclick="showView('oauth')">← Back</button>
    </div>

    <!-- ── Forgot password ── -->
    <div class="login-view" id="viewForgot">
      <form class="email-form" onsubmit="return emailForgot(event)">
        <div class="field"><label>Email</label><input type="email" id="fpEmail" autocomplete="email" required></div>
        <button class="btn-primary-full" type="submit" id="fpBtn">Send reset link</button>
      </form>
      <button class="email-toggle" style="margin-top:1rem;" onclick="showView('signin')">← Back to sign in</button>
    </div>

    <!-- ── Set new password (after clicking the reset-link email) ── -->
    <div class="login-view" id="viewRecovery">
      <p style="font-size:0.72rem;color:var(--muted);margin-bottom:1rem;max-width:280px;">Choose a new password for your account.</p>
      <form class="email-form" onsubmit="return emailSetNewPassword(event)">
        <div class="field"><label>New password</label><input type="password" id="rcPassword" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label>Confirm password</label><input type="password" id="rcPassword2" autocomplete="new-password" minlength="6" required></div>
        <button class="btn-primary-full" type="submit" id="rcBtn">Set new password</button>
      </form>
    </div>

    <div class="status-msg" id="statusMsg"></div>
    <p class="login-note" id="loginNote">Free forever. No spam. Your data stays yours.</p>
  </div>

<div class="fixed-footer"><p>WYNKO · Built for every aspirant · Free forever</p></div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(REVM2_CONFIG.SUPABASE_URL, REVM2_CONFIG.SUPABASE_ANON);

// Prefill the sign-in email if it was passed in via ?email= (e.g. redirected
// here from the landing page's waitlist form for an allowlisted account).
(function prefillEmailFromQuery(){
  const qEmail = new URLSearchParams(window.location.search).get('email');
  if (!qEmail) return;
  const siEmail = document.getElementById('siEmail');
  if (siEmail) siEmail.value = qEmail;
  openLoginDrawer();
})();

function openLoginDrawer(){
  document.getElementById('loginDrawer').classList.add('open');
  document.getElementById('loginDrawerBackdrop').classList.add('active');
}
function closeLoginDrawer(){
  document.getElementById('loginDrawer').classList.remove('open');
  document.getElementById('loginDrawerBackdrop').classList.remove('active');
}

function setStatus(msg, kind){
  const el = document.getElementById('statusMsg');
  el.textContent = msg || '';
  el.className = 'status-msg' + (kind ? ' ' + kind : '');
}

function showView(name){
  document.querySelectorAll('.login-view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  setStatus('');
  document.getElementById('loginNote').style.display = (name === 'oauth') ? 'block' : 'none';
}

async function checkSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) redirect(session.user);
}
checkSession();

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_IN'&&session) redirect(session.user);
  // Fires when the user lands here via a password-reset email link — show
  // the "set a new password" form instead of treating it as a normal
  // sign-in (there's a session, but it's only valid for changing the
  // password, not for using the app with).
  if(event==='PASSWORD_RECOVERY') showView('recovery');
});

/* ── OAUTH (Google, Microsoft, Discord, GitHub, Facebook) ──────────
   One handler for every provider — same redirect target, same
   disable-while-pending behaviour, same error surfacing. Provider-
   specific quirks (Azure needs an explicit `email` scope or it won't
   return one; Google/Microsoft support prompt=select_account to force
   the account chooser instead of silently reusing whatever session is
   already active — Discord/GitHub/Facebook don't have a real
   equivalent, so nothing's forced there) are the only per-provider
   differences. */
const OAUTH_OPTS = {
  google:   { queryParams: { prompt: 'select_account' } },
  azure:    { queryParams: { prompt: 'select_account' }, scopes: 'email' },
  discord:  {},
  github:   {},
  facebook: {},
};

async function signInOAuth(providerId){
  const buttons = document.querySelectorAll('.btn-oauth');
  const btn = document.querySelector(`.btn-oauth[data-provider="${providerId}"]`);
  buttons.forEach(b => b.disabled = true);
  btn.querySelector('.oauth-label').textContent = 'Redirecting...';
  btn.querySelector('.btn-spinner').style.display = 'block';
  setStatus('');

  const { error } = await sb.auth.signInWithOAuth({
    provider: providerId,
    options: {
      redirectTo: window.location.origin + '/login.html',
      ...OAUTH_OPTS[providerId],
    },
  });
  if(error){
    setStatus('Something went wrong. Try again.', 'err');
    buttons.forEach(b => b.disabled = false);
    btn.querySelector('.oauth-label').textContent = btn.querySelector('.oauth-label').dataset.orig || btn.querySelector('.oauth-label').textContent;
    btn.querySelector('.btn-spinner').style.display = 'none';
  }
}

/* ── TELEGRAM ─────────────────────────────────────────────────
   Telegram has no standard OAuth2 flow to plug into signInWithOAuth
   like the providers above. Its widget instead hands back a signed
   payload (verified against the bot token) which a Supabase Edge
   Function (telegram-login) checks and turns into a real session via
   a server-minted magic-link token - see that function for the full
   verification + session-creation logic. */
if(REVM2_CONFIG.TELEGRAM_BOT_ID){
  const tgScript = document.createElement('script');
  tgScript.src = 'https://telegram.org/js/telegram-widget.js?22';
  document.head.appendChild(tgScript);
} else {
  document.getElementById('telegramBtn')?.remove(); // no bot ID configured - hide rather than show a button that can't work
}

function signInTelegram(){
  if(typeof Telegram === 'undefined' || !Telegram.Login){
    setStatus('Telegram login is still loading — try again in a moment.', 'err');
    return;
  }
  const buttons = document.querySelectorAll('.btn-oauth');
  const btn = document.getElementById('telegramBtn');
  buttons.forEach(b => b.disabled = true);
  btn.querySelector('.oauth-label').textContent = 'Waiting for Telegram...';
  btn.querySelector('.btn-spinner').style.display = 'block';
  setStatus('');

  Telegram.Login.auth(
    { bot_id: REVM2_CONFIG.TELEGRAM_BOT_ID, request_access: true, lang: 'en' },
    async (tgUser) => {
      if(!tgUser){
        // User closed the Telegram popup without confirming - not an error.
        buttons.forEach(b => b.disabled = false);
        btn.querySelector('.oauth-label').textContent = btn.querySelector('.oauth-label').dataset.orig;
        btn.querySelector('.btn-spinner').style.display = 'none';
        return;
      }
      try{
        const res = await fetch(`${REVM2_CONFIG.SUPABASE_URL}/functions/v1/telegram-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(tgUser),
        });
        const body = await res.json();
        if(!res.ok || !body.token_hash) throw new Error(body.error || 'Telegram sign-in failed');
        const { error } = await sb.auth.verifyOtp({ email: body.email, token: body.token_hash, type: 'magiclink' });
        if(error) throw error;
        // onAuthStateChange's SIGNED_IN handler takes it from here.
      }catch(e){
        setStatus(e.message || 'Telegram sign-in failed. Try again.', 'err');
        buttons.forEach(b => b.disabled = false);
        btn.querySelector('.oauth-label').textContent = btn.querySelector('.oauth-label').dataset.orig;
        btn.querySelector('.btn-spinner').style.display = 'none';
      }
    }
  );
}
// Stash each button's original label once, up front, so the error path
// above can restore it (rather than being stuck on "Redirecting...").
document.querySelectorAll('.oauth-label').forEach(el => { el.dataset.orig = el.textContent; });

/* ── EMAIL + PASSWORD ────────────────────────────────────────── */
async function emailSignIn(e){
  e.preventDefault();
  const btn = document.getElementById('siBtn');
  const email = document.getElementById('siEmail').value.trim();
  const password = document.getElementById('siPassword').value;
  btn.disabled = true; btn.textContent = 'Signing in...'; setStatus('');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    setStatus(error.message === 'Invalid login credentials' ? 'Wrong email or password.' : error.message, 'err');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
  // On success, onAuthStateChange's SIGNED_IN handler takes it from here.
  return false;
}

async function emailSignUp(e){
  e.preventDefault();
  const btn = document.getElementById('suBtn');
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const password2 = document.getElementById('suPassword2').value;
  if(password !== password2){
    setStatus("Passwords don't match.", 'err');
    return false;
  }
  btn.disabled = true; btn.textContent = 'Creating account...'; setStatus('');
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + '/login.html' },
  });
  if(error){
    setStatus(error.message, 'err');
    btn.disabled = false; btn.textContent = 'Create account';
    return false;
  }
  // Whether this needs email confirmation depends on the project's auth
  // settings: if confirmation is on, signUp() returns a user but no
  // session yet — nothing to redirect with, so tell them to check their
  // inbox. If it's off, a session comes back immediately and
  // onAuthStateChange's SIGNED_IN handler fires on its own.
  if(!data.session){
    setStatus('Check your email to confirm your account.', 'ok');
    btn.textContent = 'Create account';
    btn.disabled = false;
  }
  return false;
}

async function emailForgot(e){
  e.preventDefault();
  const btn = document.getElementById('fpBtn');
  const email = document.getElementById('fpEmail').value.trim();
  btn.disabled = true; btn.textContent = 'Sending...'; setStatus('');
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html',
  });
  btn.disabled = false; btn.textContent = 'Send reset link';
  // Deliberately the same message either way — confirming/denying whether
  // an email address has an account here is exactly the kind of thing a
  // password-reset form shouldn't leak.
  setStatus('If that email has an account, a reset link is on its way.', 'ok');
}

async function emailSetNewPassword(e){
  e.preventDefault();
  const btn = document.getElementById('rcBtn');
  const password = document.getElementById('rcPassword').value;
  const password2 = document.getElementById('rcPassword2').value;
  if(password !== password2){
    setStatus("Passwords don't match.", 'err');
    return false;
  }
  btn.disabled = true; btn.textContent = 'Saving...'; setStatus('');
  const { error } = await sb.auth.updateUser({ password });
  if(error){
    setStatus(error.message, 'err');
    btn.disabled = false; btn.textContent = 'Set new password';
    return false;
  }
  setStatus('Password updated.', 'ok');
  const {data:{session}} = await sb.auth.getSession();
  if(session) redirect(session.user);
  return false;
}

async function redirect(user){
  // Save email + name into user_profiles. The row itself is guaranteed to
  // already exist by this point (created server-side by the
  // on_auth_user_created DB trigger the instant the auth account was
  // created, regardless of provider) - this upsert is just keeping
  // email/name fresh, not creating the row.
  const md = user.user_metadata || {};
  await sb.from('user_profiles').upsert({
    id: user.id,
    email: user.email,
    full_name: md.full_name || md.name || md.user_name || md.preferred_username || ''
  }, { onConflict: 'id' });

  logEvent('login');

  const {data:profile}=await sb.from('user_profiles').select('explainer_seen,onboarded').eq('id',user.id).single();
  if(!profile||!profile.explainer_seen) window.location.href='explainer.html';
  else if(!profile.onboarded) window.location.href='onboarding.html';
  else window.location.href='home.html';
}

initStarfield();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
