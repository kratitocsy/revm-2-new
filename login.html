<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RevM² — Login</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c8a96e">
<style>
.login-wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;}
.login-wrap .rm2-logo{margin-bottom:2.75rem;}
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:0.85rem;
  width:280px;background:#fff;color:#111;border:none;
  padding:0.9rem 1.5rem;font-family:var(--font);font-size:0.85rem;
  font-weight:600;letter-spacing:0.02em;cursor:pointer;transition:opacity 0.2s;
}
.btn-google:hover{opacity:0.88;}
.btn-google:disabled{opacity:0.45;cursor:not-allowed;}
.google-icon{width:18px;height:18px;flex-shrink:0;}
.spinner{display:none;width:15px;height:15px;border:2px solid rgba(0,0,0,0.15);border-top-color:#111;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.status-msg{margin-top:0.9rem;font-size:0.68rem;color:var(--gold);letter-spacing:0.08em;text-transform:uppercase;min-height:1em;}
.status-msg.err{color:var(--danger);}
.login-note{margin-top:1.6rem;font-size:0.65rem;color:var(--muted);line-height:1.65;max-width:270px;}
.fixed-footer{position:fixed;bottom:1.25rem;left:0;right:0;text-align:center;z-index:10;}
.fixed-footer p{font-size:0.6rem;color:var(--dim);letter-spacing:0.14em;text-transform:uppercase;}

/* ── DRAWER (lightweight, login-page only — always an overlay,
   never permanently pinned like the app's internal .sidebar) ── */
.login-hamburger{position:fixed;top:1.1rem;left:1.1rem;z-index:60;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;background:var(--s1);
  border:1px solid var(--border2);color:var(--text);font-size:1.05rem;cursor:pointer;}
.login-hamburger:hover{border-color:var(--gold);color:var(--gold);}
.login-drawer-backdrop{display:none;position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.6);}
.login-drawer-backdrop.active{display:block;}
.login-drawer{position:fixed;top:0;left:0;bottom:0;z-index:200;width:240px;
  background:var(--black);border-right:1px solid var(--border);
  transform:translateX(-100%);transition:transform 0.25s ease;
  display:flex;flex-direction:column;padding:1.25rem 1.1rem;}
.login-drawer.open{transform:translateX(0);box-shadow:24px 0 48px rgba(0,0,0,0.55);}
.login-drawer .rm2-logo{margin-bottom:1.75rem;}
.login-drawer-close{align-self:flex-end;background:none;border:none;color:var(--muted);
  font-size:1.2rem;cursor:pointer;margin-bottom:0.5rem;line-height:1;}
.login-drawer-close:hover{color:var(--gold);}
.login-drawer-links{display:flex;flex-direction:column;gap:0.15rem;}
.login-drawer-links a{display:block;padding:0.65rem 0.4rem;color:var(--muted);
  text-decoration:none;font-size:0.8rem;letter-spacing:0.02em;border-left:2px solid transparent;transition:all 0.15s;}
.login-drawer-links a:hover{color:var(--white);border-left-color:var(--gold);background:rgba(255,255,255,0.02);}
.login-drawer-foot{margin-top:auto;font-size:0.62rem;color:var(--dim);letter-spacing:0.08em;text-transform:uppercase;padding-top:1rem;border-top:1px solid var(--border);}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="orb"></div>

<button class="login-hamburger" id="loginHamburger" onclick="openLoginDrawer()" aria-label="Open menu">☰</button>
<div class="login-drawer-backdrop" id="loginDrawerBackdrop" onclick="closeLoginDrawer()"></div>
<aside class="login-drawer" id="loginDrawer">
  <button class="login-drawer-close" onclick="closeLoginDrawer()" aria-label="Close menu">✕</button>
  <a href="index.html"><div class="rm2-logo" data-size="small" data-noaudio="1"></div></a>
  <nav class="login-drawer-links">
    <a href="index.html">Home</a>
    <a href="index.html#features">Features</a>
    <a href="index.html#story">Our story</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="https://t.me/revm2_bot" target="_blank" rel="noopener">Telegram bot</a>
    <a href="mailto:revisionnm2@gmail.com">Contact us</a>
  </nav>
  <div class="login-drawer-foot">RevM² · Free forever</div>
</aside>

<div class="page-center">
  <div class="login-wrap">
    <div class="rm2-logo" data-size="full"></div>

    <button class="btn-google" id="googleBtn" onclick="signIn()">
      <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <span id="btnTxt">Continue with Google</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="status-msg" id="statusMsg"></div>
    <p class="login-note">Free forever. No spam. Your data stays yours.</p>
  </div>
</div>

<div class="fixed-footer"><p>RevM² · Built for every aspirant · Free forever</p></div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = window.supabase.createClient(REVM2_CONFIG.SUPABASE_URL, REVM2_CONFIG.SUPABASE_ANON);

function openLoginDrawer(){
  document.getElementById('loginDrawer').classList.add('open');
  document.getElementById('loginDrawerBackdrop').classList.add('active');
}
function closeLoginDrawer(){
  document.getElementById('loginDrawer').classList.remove('open');
  document.getElementById('loginDrawerBackdrop').classList.remove('active');
}

async function checkSession(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) redirect(session.user);
}
checkSession();

sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_IN'&&session) redirect(session.user);
});

async function signIn(){
  const btn=document.getElementById('googleBtn');
  const sp=document.getElementById('spinner');
  const txt=document.getElementById('btnTxt');
  btn.disabled=true; sp.style.display='block'; txt.textContent='Redirecting...';
  const {error}=await sb.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.origin+'/login.html'}
  });
  if(error){
    document.getElementById('statusMsg').textContent='Something went wrong. Try again.';
    document.getElementById('statusMsg').className='status-msg err';
    btn.disabled=false; sp.style.display='none'; txt.textContent='Continue with Google';
  }
}

async function redirect(user){
  // Save email + name from Google into user_profiles
  await sb.from('user_profiles').upsert({
    id: user.id,
    email: user.email,
    full_name: user.user_metadata?.full_name || ''
  }, { onConflict: 'id' });

  logEvent('login');

  const {data:profile}=await sb.from('user_profiles').select('explainer_seen,onboarded').eq('id',user.id).single();
  if(!profile||!profile.explainer_seen) window.location.href='explainer.html';
  else if(!profile.onboarded) window.location.href='onboarding.html';
  else window.location.href='tracker.html';
}

initStarfield();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
