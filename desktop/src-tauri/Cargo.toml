[package]
name = "revm2-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "revm2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
# Launches RevM2 at Windows login, hidden/minimized to tray -- so the
# native_poll.rs schedule-checking loop is already running by the time
# any scheduled block is due, without the user having to remember to
# open the app first. See lib.rs setup() for how it's registered.
tauri-plugin-autostart = "2"
sysinfo = { version = "0.30", default-features = false }
tokio = { version = "1", features = ["time", "rt", "macros"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tiny_http = "0.12"
# Used by native_poll.rs: a small, OS-timer-driven fallback that talks to
# Supabase directly instead of relying solely on the webview's own JS
# setInterval poll, which Chromium/WebView2 can throttle or pause once the
# window is treated as backgrounded (e.g. the monitor turning off) - see
# native_poll.rs's module doc for the full story. rustls-tls instead of the
# default (openssl-backed) native-tls so this doesn't need an OpenSSL
# toolchain on the Windows build machine.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

