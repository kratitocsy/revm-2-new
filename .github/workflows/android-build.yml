name: Android build

on:
  push:
    branches: [main, mobile]
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}

      - run: npm install
      - run: npm run sync-web

      - name: Lint
        working-directory: mobile/android
        run: ./gradlew lint

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew test

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  instrumented-tests:
    # Headless emulator run of ./gradlew connectedAndroidTest. Catches
    # Kotlin compile errors, plugin-registration issues (e.g. the
    # locking plugin not showing up as Capacitor.Plugins.RevM2Locking),
    # and basic UI flow breaks on every push/PR — automatically, no
    # physical device needed.
    #
    # What this does NOT validate: VpnService and Device Admin behave
    # differently (often not at all) on an emulator vs real hardware,
    # so a green run here is not equivalent to the real-device pass the
    # locking plugin still needs before Tier 2+3 is trusted. See
    # mobile/README.md.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}

      - run: npm install
      - run: npm run sync-web

      # KVM hardware acceleration — without this the emulator falls back
      # to software rendering and is impractically slow in CI.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD image/snapshot itself (separate from the Gradle
      # cache above) so most runs boot from a warm snapshot instead of
      # a cold image — this is what keeps emulator CI fast enough to
      # run on every push instead of being too slow to bother with.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: mobile/android
          script: echo "AVD snapshot created."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew connectedAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: mobile/android/app/build/reports/androidTests/connected/**
