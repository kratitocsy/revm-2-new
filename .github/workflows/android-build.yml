name: Android build

on:
  push:
    branches: [main, mobile]
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone) so the
          # release-notes step below can diff github.event.before..after
          # across every commit in the push, not just the last one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # @capacitor/cli@8.5.0 requires Node >=22; `npx cap sync android`
          # fails outright ("The Capacitor CLI requires NodeJS >=22.0.0")
          # on Node 20.
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}

      - run: npm install
      # `sync-web` alone only copies HTML/CSS/JS into www/. It does NOT
      # regenerate capacitor.build.gradle / capacitor.settings.gradle or
      # the capacitor-cordova-android-plugins/ dir that android/settings.gradle
      # and android/app/build.gradle both `apply from`/`include` unconditionally.
      # Those are gitignored, generated-on-sync files, so without this step
      # Gradle fails to even evaluate the project on a fresh checkout.
      - run: npm run build

      - name: Lint
        working-directory: mobile/android
        run: ./gradlew lint

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew test

      - name: Build debug APK
        working-directory: mobile/android
        # versionCode must strictly increase for Android to treat a build as an
        # update rather than a conflicting duplicate; github.run_number does
        # that automatically across every workflow run. versionName is kept
        # human-readable (1.0.<run_number>) so testers can see it in
        # Settings > App info / Firebase App Distribution without decoding
        # a raw versionCode.
        run: |
          ./gradlew assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      # Uploads the debug APK to Firebase App Distribution and posts a
      # shareable install link. Only runs on main (not every PR build).
      # Guarded so the whole workflow doesn't break before Firebase is
      # set up -- see the setup steps for FIREBASE_APP_ID and
      # FIREBASE_SERVICE_ACCOUNT repo secrets.
      - name: Check Firebase secrets present
        id: firebase_check
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Firebase App Distribution -- FIREBASE_APP_ID / FIREBASE_SERVICE_ACCOUNT secrets not set yet."
          fi

      # github.event.head_commit.message only captures the single latest
      # commit -- if several commits land in one push, testers only saw the
      # last one. This builds a full changelog of every commit in the push
      # (or falls back to the latest commit for workflow_dispatch/first-ever
      # push, where github.event.before doesn't point at a real commit).
      - name: Build release notes
        if: steps.firebase_check.outputs.ready == 'true'
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git log --pretty=format:"- %s (%h)" "${{ github.event.before }}..${{ github.event.after }}" > /tmp/release_notes.txt
          fi
          if [ ! -s /tmp/release_notes.txt ]; then
            git log -1 --pretty=format:"- %s (%h)" > /tmp/release_notes.txt
          fi
          echo "Release notes for this build:"
          cat /tmp/release_notes.txt

      - name: Distribute via Firebase App Distribution
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.firebase_check.outputs.ready == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotesFile: /tmp/release_notes.txt
