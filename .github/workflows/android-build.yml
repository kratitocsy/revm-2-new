name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.html'
      - 'shared.js'
      - 'style.css'
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}

      - run: npm install
      - run: npm run sync-web

      - name: Lint
        working-directory: mobile/android
        run: ./gradlew lint

      - name: Unit tests
        working-directory: mobile/android
        run: ./gradlew test

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
