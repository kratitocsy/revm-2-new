<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WYNKO — Home</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#080A12">
<link rel="stylesheet" href="home-app-dist/home-app.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #080A12; height: 100%; }
  #root { height: 100vh; }
</style>
<!-- Shared config, Store helper, auth helpers — same as every other WYNKO page -->
<script src="shared.js"></script>
<!-- Supabase JS — creates window.sb after REVM2_CONFIG is available -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Wire up window.sb the same way every other WYNKO page does it
  if (window.supabase && window.REVM2_CONFIG) {
    window.sb = window.supabase.createClient(
      REVM2_CONFIG.SUPABASE_URL,
      REVM2_CONFIG.SUPABASE_ANON
    );
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="home-app-dist/home-app.js"></script>
</body>
</html>
