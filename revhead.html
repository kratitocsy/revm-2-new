<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RevM² — Become a RevHead</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#c8a96e">
<style>
.rh-wrap{position:relative;z-index:10;max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
.rh-top{display:flex;align-items:center;gap:0.9rem;margin-bottom:1.75rem;}
.rh-title{font-size:1.3rem;font-weight:900;color:var(--white);text-transform:uppercase;letter-spacing:-0.02em;}
.rh-back{font-size:0.7rem;color:var(--muted);text-decoration:none;letter-spacing:0.06em;text-transform:uppercase;margin-left:auto;}
.rh-back:hover{color:var(--gold);}
.rh-card{background:var(--s1);border:1px solid var(--border);padding:1.5rem;margin-bottom:1.25rem;border-radius:6px;}
.rh-hero{background:linear-gradient(135deg,var(--s1) 0%,rgba(200,169,110,0.08) 100%);border:1px solid var(--gold);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem;}
.rh-hero h2{color:var(--gold);font-size:1.05rem;margin-bottom:0.5rem;}
.rh-hero p{font-size:0.82rem;color:var(--muted);line-height:1.5;}
.rh-status-pill{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.65rem;padding:0.3rem 0.7rem;border-radius:99px;letter-spacing:0.05em;text-transform:uppercase;font-weight:700;}
.rh-status-pill.pending{background:rgba(224,160,48,0.14);color:#e0a030;}
.rh-status-pill.verified{background:rgba(74,222,128,0.14);color:var(--success);}
.rh-status-pill.rejected{background:rgba(239,68,68,0.14);color:var(--danger);}
.rh-code-box{display:flex;align-items:center;gap:0.75rem;background:var(--s2);border:1px dashed var(--gold);border-radius:6px;padding:0.9rem 1.1rem;margin:0.75rem 0;}
.rh-code{font-size:1.3rem;font-weight:900;letter-spacing:0.15em;color:var(--gold);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.9rem;margin-bottom:0.5rem;}
.stat-card{background:var(--s2);border:1px solid var(--border);padding:0.9rem 1rem;border-radius:6px;}
.stat-card .label{font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.35rem;}
.stat-card .val{font-size:1.3rem;font-weight:900;color:var(--white);}
table.rh-table{width:100%;border-collapse:collapse;font-size:0.75rem;margin-top:0.5rem;}
.rh-table th{text-align:left;font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:0.5rem 0.6rem;border-bottom:1px solid var(--border);font-weight:600;}
.rh-table td{padding:0.55rem 0.6rem;border-bottom:1px solid var(--border);color:var(--text);}
.tier-table{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:0.75rem;}
.tier-table th{text-align:left;font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:0.6rem 0.7rem;border-bottom:1px solid var(--border);font-weight:600;}
.tier-table td{padding:0.65rem 0.7rem;border-bottom:1px solid var(--border);}
.tier-table tr:last-child td{border-bottom:none;}
.tier-highlight{color:var(--gold);font-weight:700;}
.flow-steps{counter-reset:step;list-style:none;padding:0;margin:0.75rem 0 0;}
.flow-steps li{counter-increment:step;position:relative;padding:0 0 1rem 2.2rem;font-size:0.8rem;color:var(--text);line-height:1.5;}
.flow-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--s2);border:1px solid var(--gold);color:var(--gold);font-size:0.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;}
.flow-steps li b{color:var(--white);}
.how-toggle{background:none;border:none;color:var(--gold);font-size:0.72rem;cursor:pointer;text-decoration:underline;padding:0;margin-top:0.5rem;}
.rh-loading{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:0.8rem;}
.copy-btn{background:none;border:1px solid var(--border2);color:var(--muted);font-size:0.65rem;padding:0.3rem 0.6rem;border-radius:4px;cursor:pointer;}
.copy-btn:hover{border-color:var(--gold);color:var(--gold);}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="orb"></div>

<div class="rh-wrap" id="rhWrap">
  <div class="rh-loading">Loading…</div>
</div>

<div class="rh-wrap" id="howItWorksWrap" style="padding-top:0;"></div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
RevM2Loader.show('Loading…');
const sb = window.supabase.createClient(REVM2_CONFIG.SUPABASE_URL, REVM2_CONFIG.SUPABASE_ANON);
let me = null;

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href='login.html'; return; }
  me = session.user;
  RevM2Calls.init(sb, me.id);
  RevM2Notifications.init(sb, me.id);

  const { data: profile } = await sb.from('user_profiles')
    .select('is_revhead,revhead_status,revhead_applied_at,revhead_verified_at,revhead_code,referred_by_code')
    .eq('id', me.id).single();

  if(!profile || profile.revhead_status === 'none' || !profile.revhead_status){
    renderApplyForm(null);
  } else if(profile.revhead_status === 'pending'){
    renderPending(profile);
  } else if(profile.revhead_status === 'rejected'){
    renderApplyForm(profile);
  } else if(profile.revhead_status === 'verified'){
    await renderDashboard(profile);
  }
  renderHowItWorks();
  RevM2Logo.init();
  RevM2Loader.hide();
}

function shell(inner){
  return `
    <div class="rh-top">
      <div class="rm2-logo" data-size="nav"></div>
      <div class="rh-title">RevHead</div>
      <a class="rh-back" href="tracker.html">← Back to tracker</a>
    </div>
    ${inner}
  `;
}

function renderApplyForm(profile){
  const rejectedNote = profile?.revhead_status === 'rejected'
    ? `<div class="rh-status-pill rejected" style="margin-bottom:1rem;">Application not approved</div><p style="font-size:0.78rem;color:var(--muted);margin-bottom:1rem;">You can re-apply if things have changed — e.g. a larger or more active community.</p>`
    : '';

  document.getElementById('rhWrap').innerHTML = shell(`
    <div class="rh-hero">
      <h2>Become a RevHead</h2>
      <p>RevHeads are verified student community leaders — JEE, NEET, UPSC, CAT, GATE and more — who get their own official, verified study group on RevM², a revenue dashboard, and community analytics. Applications are reviewed by the RevM² team, usually within 24 hours.</p>
    </div>
    <div class="rh-card">
      ${rejectedNote}
      <div class="field"><label>Referral code (optional)</label>
        <input id="rhCode" placeholder="e.g. AB12CD3" style="text-transform:uppercase;">
        <div style="font-size:0.68rem;color:var(--muted);margin-top:0.35rem;">Got a code from an existing RevHead? Enter it here — it doesn't affect your approval odds, it just means they get a small share of what you earn for your first 3 months. Leave blank if you don't have one.</div>
      </div>
      <button class="btn btn-gold" style="width:100%;margin-top:0.5rem;" onclick="submitApplication()">Apply to become a RevHead</button>
      <div id="applyMsg" style="font-size:0.75rem;color:var(--danger);margin-top:0.6rem;"></div>
    </div>
  `);
}

async function submitApplication(){
  const code = document.getElementById('rhCode').value.trim().toUpperCase() || null;
  const { error } = await sb.rpc('revhead_apply', { p_referral_code: code });
  if(error){
    document.getElementById('applyMsg').textContent = error.message;
    return;
  }
  RevM2Loader.show('Submitting…');
  await init();
}

function renderPending(profile){
  document.getElementById('rhWrap').innerHTML = shell(`
    <div class="rh-card">
      <div class="rh-status-pill pending">Application pending</div>
      <p style="font-size:0.85rem;margin-top:0.9rem;line-height:1.6;">Your RevHead application is in review. Approvals are typically handled within 24 hours.</p>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:0.6rem;">Applied ${profile.revhead_applied_at ? fmtDateShort(profile.revhead_applied_at.split('T')[0]) : '—'}${profile.referred_by_code ? ` · referral code used: ${escHtml(profile.referred_by_code)}` : ''}</p>
    </div>
  `);
}

async function renderDashboard(profile){
  document.getElementById('rhWrap').innerHTML = shell(`
    <div class="rh-hero">
      <div class="rh-status-pill verified">Verified RevHead</div>
      <h2 style="margin-top:0.75rem;">Your referral code</h2>
      <div class="rh-code-box">
        <div class="rh-code">${escHtml(profile.revhead_code || '—')}</div>
        <button class="copy-btn" onclick="copyCode('${profile.revhead_code||''}')">Copy</button>
      </div>
      <p>Share this with other genuine community leaders. If they apply using it and get verified, you earn 10% of what they make on RevM² for their first 3 months as a RevHead.</p>
    </div>

    <div class="rh-card">
      <h3 style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.9rem;">This month</h3>
      <div class="stat-grid" id="rhEarningsStats">
        <div class="stat-card"><div class="label">Your earnings</div><div class="val">—</div></div>
        <div class="stat-card"><div class="label">Referral earnings</div><div class="val">—</div></div>
      </div>
    </div>

    <div class="rh-card">
      <h3 style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.9rem;">People you referred</h3>
      <div id="rhReferralsBox">Loading…</div>
    </div>

    <div class="rh-card">
      <h3 style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.9rem;">Payouts</h3>
      <div class="stat-grid" style="margin-bottom:1rem;">
        <div class="stat-card"><div class="label">Wallet balance</div><div class="val" id="rhWalletBalance">—</div></div>
      </div>
      <div class="field"><label>UPI ID</label>
        <div style="display:flex;gap:0.5rem;">
          <input id="rhUpiId" placeholder="yourname@bank" style="flex:1;">
          <button class="btn btn-ghost" onclick="saveUpiId()">Save</button>
        </div>
        <div id="upiMsg" style="font-size:0.7rem;margin-top:0.4rem;"></div>
      </div>
      <button class="btn btn-gold" style="width:100%;margin-top:0.75rem;" onclick="requestPayout()">Request Payout</button>
      <div id="payoutMsg" style="font-size:0.75rem;margin-top:0.5rem;"></div>
      <div id="payoutHistoryBox" style="margin-top:1rem;"></div>
    </div>

    <div class="rh-card" style="border-color:var(--border2);">
      <h3 style="font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;">Estimated earnings (projection)</h3>
      <p style="font-size:0.7rem;color:var(--muted);margin-bottom:0.9rem;line-height:1.4;">This is an illustration based on your group's real study hours and assumed ad/premium rates — <b>not real money and not part of your wallet balance</b>. Ads and premium aren't live yet, so nothing here is currently payable.</p>
      <div id="rhEstimateBox">Loading…</div>
    </div>

    <div class="rh-card">
      <a class="btn btn-ghost" style="width:100%;" href="groups.html">Create your official RevHead group →</a>
    </div>
  `);

  const [{ data: earnings }, { data: referrals }, { data: profileFull }] = await Promise.all([
    sb.rpc('my_revhead_earnings_summary', { p_days: 30 }),
    sb.rpc('my_revhead_referrals'),
    sb.from('user_profiles').select('upi_id').eq('id', me.id).single()
  ]);

  if(profileFull?.data?.upi_id) document.getElementById('rhUpiId').value = profileFull.data.upi_id;
  await refreshWalletAndHistory();
  await loadEarningsEstimate();

  if(earnings && earnings[0]){
    document.getElementById('rhEarningsStats').innerHTML = `
      <div class="stat-card"><div class="label">Your earnings (30d)</div><div class="val">₹${Number(earnings[0].own_earnings||0).toLocaleString('en-IN')}</div></div>
      <div class="stat-card"><div class="label">Referral earnings (30d)</div><div class="val">₹${Number(earnings[0].referral_earnings||0).toLocaleString('en-IN')}</div></div>
    `;
  }

  const box = document.getElementById('rhReferralsBox');
  if(!referrals || !referrals.length){
    box.innerHTML = `<div style="font-size:0.78rem;color:var(--muted);">You haven't referred anyone yet — share your code above.</div>`;
    return;
  }
  box.innerHTML = `
    <table class="rh-table">
      <thead><tr><th>RevHead</th><th>Verified</th><th>Days left in window</th><th>Earned from them</th></tr></thead>
      <tbody>${referrals.map(r=>`
        <tr>
          <td>${escHtml(r.full_name||'—')}<br><span style="color:var(--muted);font-size:0.68rem">${escHtml(r.email||'')}</span></td>
          <td>${r.verified_at ? fmtDateShort(r.verified_at.split('T')[0]) : '—'}</td>
          <td>${r.days_left_in_window}</td>
          <td>₹${Number(r.total_share_earned||0).toLocaleString('en-IN')}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

async function saveUpiId(){
  const val = document.getElementById('rhUpiId').value.trim();
  const msg = document.getElementById('upiMsg');
  const { error } = await sb.rpc('set_my_upi_id', { p_upi_id: val });
  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }
  msg.style.color = 'var(--success)'; msg.textContent = 'Saved.';
}

async function requestPayout(){
  const msg = document.getElementById('payoutMsg');
  msg.style.color = 'var(--text)'; msg.textContent = 'Requesting…';
  const { data, error } = await sb.rpc('request_payout');
  if(error){ msg.style.color = 'var(--danger)'; msg.textContent = error.message; return; }
  msg.style.color = 'var(--success)';
  msg.textContent = `Requested ₹${Number(data[0].amount).toLocaleString('en-IN')} — usually reviewed within 24–48h.`;
  await refreshWalletAndHistory();
}

async function refreshWalletAndHistory(){
  const [{ data: balance }, { data: history }] = await Promise.all([
    sb.rpc('my_wallet_balance'),
    sb.rpc('my_payout_history')
  ]);

  const balEl = document.getElementById('rhWalletBalance');
  if(balEl) balEl.textContent = `₹${Number(balance||0).toLocaleString('en-IN')}`;

  const box = document.getElementById('payoutHistoryBox');
  if(!box) return;
  if(!history || !history.length){
    box.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);">No payout requests yet.</div>`;
    return;
  }
  const statusColor = { pending: '#e0a030', paid: 'var(--success)', rejected: 'var(--danger)' };
  box.innerHTML = `
    <table class="rh-table">
      <thead><tr><th>Requested</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>${history.map(h=>`
        <tr>
          <td>${fmtDateShort(h.requested_at.split('T')[0])}</td>
          <td>₹${Number(h.amount).toLocaleString('en-IN')}</td>
          <td style="color:${statusColor[h.status]||'var(--muted)'};text-transform:capitalize;">${h.status}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

async function loadEarningsEstimate(){
  const box = document.getElementById('rhEstimateBox');
  if(!box) return;

  const { data: myGroup } = await sb.from('study_groups')
    .select('id,name').eq('owner_id', me.id).eq('is_revhead_group', true).limit(1).maybeSingle();

  if(!myGroup){
    box.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);">Create your official RevHead group to see a projection here.</div>`;
    return;
  }

  const { data, error } = await sb.rpc('my_group_earnings_estimate', { p_group_id: myGroup.id, p_days: 30 });
  if(error || !data || !data[0]){
    box.innerHTML = `<div style="font-size:0.75rem;color:var(--muted);">${error ? escHtml(error.message) : 'Not enough data yet.'}</div>`;
    return;
  }
  const e = data[0];
  box.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Study hours (30d)</div><div class="val">${e.study_hours}h</div></div>
      <div class="stat-card"><div class="label">Members</div><div class="val">${e.member_count}</div></div>
      <div class="stat-card"><div class="label">Est. ad revenue</div><div class="val">₹${Number(e.estimated_ad_revenue).toLocaleString('en-IN')}</div></div>
      <div class="stat-card"><div class="label">Est. premium revenue</div><div class="val">₹${Number(e.estimated_premium_revenue).toLocaleString('en-IN')}</div></div>
    </div>
    <div style="margin-top:0.75rem;font-size:0.8rem;color:var(--gold);font-weight:700;">Est. total: ₹${Number(e.estimated_total).toLocaleString('en-IN')}/mo (projection only)</div>
  `;
}

function copyCode(code){
  navigator.clipboard.writeText(code);
}

function renderHowItWorks(){
  document.getElementById('howItWorksWrap').innerHTML = `
    <div class="rh-card">
      <h3 style="font-size:0.95rem;color:var(--gold);margin-bottom:0.6rem;">How the RevHead program works</h3>

      <table class="tier-table">
        <thead><tr><th>Tier</th><th>How you get here</th><th>Earning rate</th><th>Extras</th></tr></thead>
        <tbody>
          <tr>
            <td>Normal group owner</td>
            <td>Just create a study group — no application</td>
            <td>Reduced rate once your group hits a minimum size</td>
            <td>—</td>
          </tr>
          <tr>
            <td class="tier-highlight">Verified RevHead</td>
            <td>Apply (with or without a referral code) → reviewed within ~24h</td>
            <td class="tier-highlight">Full rate</td>
            <td>Verified badge, official group, referral code, community dashboard</td>
          </tr>
        </tbody>
      </table>

      <button class="how-toggle" onclick="document.getElementById('howDetail').style.display=document.getElementById('howDetail').style.display==='block'?'none':'block'">How does the earning & payout actually work?</button>

      <div id="howDetail" style="display:none;margin-top:1rem;">
        <ol class="flow-steps">
          <li><b>Everyone earns from their own community's engagement</b> — the more your members actually study together on RevM², the more your group generates.</li>
          <li><b>Normal groups earn a reduced rate</b> once they cross a minimum member count — this isn't a manual process, it's based on real activity in your group, not just creating it.</li>
          <li><b>Applying and getting verified as a RevHead unlocks the full rate</b> — plus an official verified group, your own referral code, and a community analytics dashboard.</li>
          <li><b>Grow first, apply later works too</b> — if your normal group is already performing well, you'll see a banner here and in Study Groups suggesting you apply, based on your actual numbers.</li>
          <li><b>Referral code (RevHead-only)</b> — if a new RevHead applied using your code, you earn 10% of what they personally make on RevM² for their first 90 days as a verified RevHead. After that, it stops automatically — they keep 100% going forward.</li>
          <li><b>Payouts</b> — earnings are tracked in your dashboard as they're generated. Actual bank/UPI disbursement is being built next (via a payment gateway) — for now, think of the numbers you see as your running balance, not yet a completed transfer.</li>
        </ol>
      </div>
    </div>
  `;
}

init();
initStarfield();
</script>
</body>
</html>
