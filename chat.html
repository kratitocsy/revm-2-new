<script>
const ICON_PHONE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1v3.4c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8z"/></svg>`;
const ICON_VIDEO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.6"/><path d="M15.5 10.2 21 7.3v9.4l-5.5-2.9z"/></svg>`;

const ICON_MIC_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M8.3 21h7.4"/><line x1="3" y1="3" x2="21" y2="21"/></svg>`;
const ICON_CLOSE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 7"/></svg>`;
const ICON_SEND = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6 21 12 3.4 3.4l.15 6.9L15 12 3.55 13.7z"/></svg>`;

const sb = window.supabase.createClient(REVM2_CONFIG.SUPABASE_URL, REVM2_CONFIG.SUPABASE_ANON);
let me = null;
const params = new URLSearchParams(location.search);
const FID = params.get('fid');
const AUTOSTART_CALL = params.get('call'); // 'voice' | 'video' | null
const AUTOACCEPT_CALL = params.get('autoaccept') === '1'; // set when the person tapped Accept on the global (cross-page) incoming-call toast

const DEFAULT_AVATAR_ICON = `<svg class="default-avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="2.6"/><path d="M6.5 14.2c0-2 2.3-3.4 5.5-3.4s5.5 1.4 5.5 3.4"/><path d="M3 19.5h18"/><path d="M6.5 19.5v-2.3M17.5 19.5v-2.3"/></svg>`;
function avatarHtml(url){ return url ? `<img src="${escHtml(url)}" alt="">` : DEFAULT_AVATAR_ICON; }

let peer = null; // {id, username, display_name, avatar_url}
let myUsername = null, myAvatarUrl = null;

/* ── INIT ─────────────────────────────────────────────────── */
async function init(){
  RevM2Loader.show('Opening chat…');
  const session = await requireAuth();
  if(!session) return;
  me = session.user;
  RevM2Calls.init(sb, me.id); // start listening for calls that arrive while I'm on OTHER pages too
  RevM2Notifications.init(sb, me.id);

  if(!FID){ showFatal('No conversation selected.'); RevM2Loader.hide(); return; }

  try{
    const {data:mp} = await sb.from('user_profiles').select('username,avatar_url').eq('id',me.id).single();
    if(mp){ myUsername = mp.username; myAvatarUrl = mp.avatar_url; }
  }catch(e){ /* best-effort — call still works, just without a name/avatar on the global toast */ }

  const ok = await resolvePeer();
  if(!ok){ showFatal("Couldn't load this conversation — you may no longer be study partners."); RevM2Loader.hide(); return; }

  renderHeader();
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatComposer').style.display = 'flex';

  await loadHistory();
  subscribeMessages();
  initPresence();
  initCallChannel();

  RevM2Loader.hide();

  if(AUTOACCEPT_CALL && (AUTOSTART_CALL === 'voice' || AUTOSTART_CALL === 'video')){
    // They tapped "Accept" on the global incoming-call toast from somewhere else on
    // the site (see RevM2Calls in shared.js) — jump straight to connecting instead
    // of making them accept twice.
    callType = AUTOSTART_CALL;
    callState = 'incoming';
    iWasCaller = false;
    showRingingOverlay(`Incoming ${callType==='video'?'video':'voice'} call…`, []);
    document.getElementById('callStatusSub').textContent = 'Connecting…';
    acceptCall();
  } else if(AUTOSTART_CALL === 'voice' || AUTOSTART_CALL === 'video'){
    startCall(AUTOSTART_CALL);
  }
}

function showFatal(text){
  document.getElementById('chatEmptyMsg').textContent = text;
}

/* Resolve the friend behind ?fid= using the existing list_friends() RPC.
   We don't assume its exact column name for the peer's user id — try the
   common ones so this keeps working regardless of your schema. */
async function resolvePeer(){
  const { data, error } = await sb.rpc('list_friends');
  if(error || !data) return false;
  const row = data.find(f => f.friendship_id === FID);
  if(!row) return false;
  const peerId = row.id || row.user_id || row.friend_id || row.peer_id;
  if(!peerId){ console.error('list_friends() did not expose the friend user id — chat cannot resolve a recipient.'); return false; }
  peer = {
    id: peerId,
    username: row.username || '',
    display_name: row.display_name || row.track || '',
    avatar_url: row.avatar_url || null
  };
  return true;
}

function renderHeader(){
  document.getElementById('chatAvatar').innerHTML = avatarHtml(peer.avatar_url);
  document.getElementById('chatHName').textContent = peer.display_name || ('@'+peer.username);
  document.getElementById('chatHSub').textContent = '@'+peer.username;
}

/* ── MESSAGE HISTORY ──────────────────────────────────────── */
let renderedIds = new Set();

async function loadHistory(){
  const { data, error } = await sb.from('dm_messages').select('*').eq('friendship_id', FID).order('created_at', { ascending: true });
  if(error){ showFatal('Could not load messages.'); return; }
  const scroll = document.getElementById('chatScroll');
  scroll.innerHTML = '';
  if(!data || !data.length){
    scroll.innerHTML = `<div class="chat-empty">No messages yet — say hi to @${escHtml(peer.username)}.</div>`;
  } else {
    data.forEach(renderMessage);
  }
  scroll.scrollTop = scroll.scrollHeight;
  markIncomingRead();
}

function subscribeMessages(){
  sb.channel(`dm-messages-${FID}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'dm_messages', filter: `friendship_id=eq.${FID}` }, ({ new: row }) => {
      const scroll = document.getElementById('chatScroll');
      const wasEmpty = scroll.querySelector('.chat-empty');
      if(wasEmpty) scroll.innerHTML = '';
      renderMessage(row);
      scroll.scrollTop = scroll.scrollHeight;
      if(row.recipient_id === me.id) markIncomingRead();
    })
    .subscribe();
}

function renderMessage(row){
  if(renderedIds.has(row.id)) return;
  renderedIds.add(row.id);
  const scroll = document.getElementById('chatScroll');
  const mine = row.sender_id === me.id;
  const time = new Date(row.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

  if(row.kind === 'call_log'){
    const icon = row.call_type === 'video'
      ? '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="12" height="11" rx="2"/><path d="M17.5 10.2 21 8v8l-3.5-2.2z"/></svg>'
      : '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1L6.6 10.8z"/></svg>';
    const dir = mine ? '↗' : '↙';
    let statusText, statusCls;
    if(row.call_status === 'completed'){ statusText = fmtCallDuration(row.call_duration_seconds||0); statusCls='completed'; }
    else if(row.call_status === 'declined'){ statusText = 'Declined'; statusCls='declined'; }
    else if(row.call_status === 'cancelled'){ statusText = 'Cancelled'; statusCls='declined'; }
    else { statusText = 'Missed'; statusCls='missed'; }
    const label = mine ? 'Outgoing Call' : 'Incoming Call';
    const div = document.createElement('div');
    div.className = 'msg-row calllog';
    div.innerHTML = `<div class="calllog-bubble">
      <span class="calllog-icon ${statusCls}">${icon}</span>
      <span>${label} ${dir}</span>
      <span class="calllog-status ${statusCls}">${statusText}</span>
      <span style="color:var(--dim);">${time}</span>
    </div>`;
    scroll.appendChild(div);
    return;
  }

  const div = document.createElement('div');
  div.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
  const readTick = mine ? `<span class="msg-read">${row.read_at ? '✓✓' : '✓'}</span>` : '';
  div.innerHTML = `<div class="msg-bubble">${escHtml(row.body||'')}<div class="msg-time">${time} ${readTick}</div></div>`;
  scroll.appendChild(div);
}

function fmtCallDuration(secs){
  const m = Math.floor(secs/60), s = secs%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

async function markIncomingRead(){
  await sb.from('dm_messages').update({ read_at: new Date().toISOString() }).eq('friendship_id', FID).eq('recipient_id', me.id).is('read_at', null);
}

/* ── COMPOSER ─────────────────────────────────────────────── */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  document.getElementById('sendBtn').disabled = el.value.trim().length === 0;
}
function handleComposerKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if(!body) return;
  input.value=''; autoGrow(input);
  const { error } = await sb.from('dm_messages').insert({ friendship_id: FID, sender_id: me.id, recipient_id: peer.id, kind: 'text', body });
  if(error) console.error(error);
}

/* ── PRESENCE (online indicator) ─────────────────────────── */
function initPresence(){
  const ch = sb.channel(`dm-presence-${FID}`, { config: { presence: { key: me.id } } })
    .on('presence', { event: 'sync' }, () => {
      const online = Object.keys(ch.presenceState()).includes(peer.id);
      document.getElementById('chatAvatar').classList.toggle('online', online);
      const sub = document.getElementById('chatHSub');
      sub.textContent = online ? 'online' : '@'+peer.username;
      sub.classList.toggle('online', online);
    })
    .subscribe(async (status) => { if(status === 'SUBSCRIBED') await ch.track({ online: true }); });
}

/* ── CALL (WebRTC mesh, 1:1) ──────────────────────────────
   Same pattern as groups.html's group call, scoped to two
   people on a dedicated per-friendship channel. Signaling rides
   Supabase Realtime broadcast; media flows peer-to-peer. */
/* ── ICE servers: STUN always + short-lived TURN fallback ────
   TURN only kicks in when a direct/STUN peer-to-peer path fails
   (symmetric NAT, some mobile carriers/corporate networks) — most
   calls never touch it, but without it those calls just never connect.

   Uses Metered.ca's free tier: their public "app domain" + API key
   is designed to be called straight from client JS (rate-limited,
   short-lived credentials — this is not a secret to protect like an
   account password). Sign up free at https://www.metered.ca/tools/openrelay/
   then fill in METERED_APP_DOMAIN + METERED_API_KEY below.
   Until those are filled in, calls silently fall back to STUN-only
   (same behavior as before — nothing breaks if you skip this). */
const METERED_APP_DOMAIN = 'revm2.metered.live';
const METERED_API_KEY = '750826d81cf1efa37341c785599505a59e5d';

const STUN_ONLY = [{ urls: 'stun:stun.l.google.com:19302' }];
let _iceServersCache = null, _iceServersFetchedAt = 0;
const ICE_CACHE_MS = 6 * 60 * 60 * 1000; // Metered creds are valid ~24h; refresh well before that

async function getIceServers(){
  if(!METERED_APP_DOMAIN || !METERED_API_KEY) return STUN_ONLY;
  const fresh = _iceServersCache && (Date.now() - _iceServersFetchedAt) < ICE_CACHE_MS;
  if(fresh) return _iceServersCache;
  try{
    const res = await fetch(`https://${METERED_APP_DOMAIN}/api/v1/turn/credentials?apiKey=${METERED_API_KEY}`);
    if(!res.ok) throw new Error('turn credential fetch failed');
    const servers = await res.json(); // array of {urls, username, credential}
    if(!Array.isArray(servers) || !servers.length) throw new Error('empty turn credential response');
    _iceServersCache = [...STUN_ONLY, ...servers];
    _iceServersFetchedAt = Date.now();
    return _iceServersCache;
  }catch(e){
    console.warn('TURN credentials unavailable, falling back to STUN-only:', e);
    return STUN_ONLY;
  }
}
let callChannel = null, pc = null, localStream = null;
let callState = 'idle'; // idle | outgoing | incoming | connected
let callType = 'voice'; // voice | video
let micOn = true, camOn = true;
let callStartedAt = null, ringTimeout = null;
let iWasCaller = false; // only the caller writes the call-log row, so both sides don't double-log

function initCallChannel(){
  callChannel = sb.channel(`dm-call-${FID}`, { config: { presence: { key: me.id } } })
    .on('broadcast', { event: 'call' }, ({ payload }) => handleCallSignal(payload))
    .subscribe();
  if('Notification' in window && Notification.permission==='default') Notification.requestPermission();
}

function sendCallSignal(data){
  callChannel.send({ type: 'broadcast', event: 'call', payload: { from: me.id, to: peer.id, ...data } });
}

async function startCall(type){
  if(callState !== 'idle') return;
  callType = type;
  callState = 'outgoing';
  iWasCaller = true;
  showRingingOverlay('Calling…', []);
  startCallRingtone();
  sendCallSignal({ kind: 'ring', callType: type });
  ringGlobally(type);
  ringTimeout = setTimeout(()=>{ if(callState==='outgoing'){ sendCallSignal({kind:'cancel'}); logCallOutcome('missed', 0); teardownCall(); } }, 30000);
}

/* Also pings the callee's cross-page channel (see RevM2Calls in shared.js)
   so they get a ringing toast + notification even if they don't already
   have this exact chat conversation open. */
function ringGlobally(type){
  try{
    const ch = sb.channel(`user-calls-${peer.id}`);
    ch.subscribe(status=>{
      if(status==='SUBSCRIBED'){
        ch.send({ type:'broadcast', event:'incoming_call', payload:{
          fid: FID, fromUserId: me.id, toUserId: peer.id, callType: type,
          fromUsername: myUsername, fromAvatarUrl: myAvatarUrl
        }});
        setTimeout(()=>sb.removeChannel(ch), 800);
      }
    });
  }catch(e){ /* global ring is a nice-to-have, never break the actual call */ }
}

async function handleCallSignal(payload){
  if(!payload || payload.to !== me.id) return;
  if(payload.kind === 'ring'){
    if(callState !== 'idle') { sendCallSignalTo(payload.from, {kind:'decline'}); return; } // busy
    callType = payload.callType;
    callState = 'incoming';
    iWasCaller = false;
    showRingingOverlay(`Incoming ${callType==='video'?'video':'voice'} call…`, [
      `<div class="call-btn-wrap"><button class="call-btn decline" onclick="declineCall()">${ICON_PHONE}</button><span class="call-btn-label">Decline</span></div>`,
      `<div class="call-btn-wrap"><button class="call-btn accept" onclick="acceptCall()">${ICON_PHONE}</button><span class="call-btn-label">Accept</span></div>`
    ]);
    startCallRingtone();
    notifyIncomingCall();
  } else if(payload.kind === 'accept'){
    clearTimeout(ringTimeout);
    stopCallRingtone(); closeCallNotification();
    await beginMedia(true);
  } else if(payload.kind === 'decline'){
    stopCallRingtone(); closeCallNotification();
    logCallOutcome('declined', 0);
    teardownCall();
  } else if(payload.kind === 'cancel'){
    stopCallRingtone(); closeCallNotification();
    teardownCall(); // the caller already logged 'cancelled' when they pressed cancel
  } else if(payload.kind === 'end'){
    logCallOutcome('completed', elapsedSeconds()); // no-op unless I'm the caller — covers "other side hung up first"
    teardownCall();
  } else if(payload.kind === 'offer'){
    if(!pc) await beginMedia(false);
    await pc.setRemoteDescription(payload.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendCallSignal({ kind:'answer', sdp: pc.localDescription });
  } else if(payload.kind === 'answer'){
    await pc.setRemoteDescription(payload.sdp);
  } else if(payload.kind === 'ice'){
    try{ await pc.addIceCandidate(payload.candidate); }catch(e){}
  }
}
function sendCallSignalTo(to, data){ callChannel.send({ type:'broadcast', event:'call', payload:{ from: me.id, to, ...data } }); }

async function acceptCall(){
  stopCallRingtone(); closeCallNotification();
  sendCallSignal({ kind: 'accept' });
  await beginMedia(true);
}
function declineCall(){
  stopCallRingtone(); closeCallNotification();
  sendCallSignal({ kind: 'decline' }); // caller logs 'declined' when this arrives
  teardownCall();
}
function cancelOutgoingCall(){
  clearTimeout(ringTimeout);
  stopCallRingtone(); closeCallNotification();
  sendCallSignal({ kind: 'cancel' });
  logCallOutcome('cancelled', 0);
  teardownCall();
}
function endCall(){
  stopCallRingtone(); closeCallNotification();
  sendCallSignal({ kind: 'end' });
  logCallOutcome('completed', elapsedSeconds());
  teardownCall();
}

async function beginMedia(iInitiate){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: callType === 'video' });
  } catch(e){
    alert('Could not access camera/mic. Check your browser permissions and try again.');
    sendCallSignal({ kind: 'decline' });
    teardownCall();
    return;
  }
  callState = 'connected';
  callStartedAt = Date.now();
  showConnectedUI();

  pc = new RTCPeerConnection({
    iceServers: await getIceServers(),
    iceTransportPolicy: 'all'   // 'all' = use relay ONLY if direct/STUN fails (never 'relay' which forces TURN for everyone)
  });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => { if(e.candidate) sendCallSignal({ kind:'ice', candidate: e.candidate }); };
  pc.ontrack = e => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if(pc.connectionState === 'connected') logRelayUsage(pc, 'dm_1to1', FID, callType);
    if(['failed','disconnected','closed'].includes(pc.connectionState) && callState==='connected'){ endCall(); }
  };
  if(iInitiate){
    pc.onnegotiationneeded = async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendCallSignal({ kind: 'offer', sdp: pc.localDescription });
    };
  }
}

function showRingingOverlay(subText, buttonsHtml){
  document.getElementById('callOverlay').classList.add('show');
  document.getElementById('callRingingUI').style.display = 'block';
  document.getElementById('callVideoStage').classList.remove('show');
  document.getElementById('callPeerAvatar').innerHTML = avatarHtml(peer.avatar_url);
  document.getElementById('callStatusName').textContent = peer.display_name || ('@'+peer.username);
  document.getElementById('callStatusSub').textContent = subText;
  const controls = document.getElementById('callRingingControls');
  if(buttonsHtml.length){
    controls.innerHTML = buttonsHtml.join('');
  } else {
    controls.innerHTML = `<div class="call-btn-wrap"><button class="call-btn decline" onclick="cancelOutgoingCall()">${ICON_PHONE}</button><span class="call-btn-label">Cancel</span></div>`;
  }
}

function showConnectedUI(){
  document.getElementById('callRingingUI').style.display = 'none';
  document.getElementById('callVideoStage').classList.add('show');
  const local = document.getElementById('localVideo');
  local.srcObject = localStream;
  local.style.display = callType === 'video' ? 'block' : 'none';
  document.getElementById('remoteVideo').style.display = callType === 'video' ? 'block' : 'none';
  micOn = true; camOn = true;
  updateCallBtns();
}

function toggleMute(){
  if(!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  updateCallBtns();
}
function toggleCallCam(){
  if(!localStream || callType !== 'video') return;
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  updateCallBtns();
}
function updateCallBtns(){
  const mb = document.getElementById('muteBtn');
  const cb = document.getElementById('camBtn');
  const cbWrap = document.getElementById('camBtnWrap');
  const muteLabel = document.getElementById('muteBtnLabel');
  if(mb){
    mb.classList.toggle('off', !micOn);
    mb.innerHTML = micOn ? ICON_MIC : ICON_MIC_OFF;
    if(muteLabel) muteLabel.textContent = micOn ? 'Mute' : 'Unmute';
  }
  if(cbWrap) cbWrap.style.display = callType === 'video' ? 'flex' : 'none';
  if(cb) cb.classList.toggle('off', !camOn);
}

function elapsedSeconds(){ return callStartedAt ? Math.round((Date.now()-callStartedAt)/1000) : 0; }

/* ── TURN relay detection ─────────────────────────────────────
   Reads getStats() once the connection is established to find the
   winning ICE candidate pair. Only logs a row if the connection
   actually used a TURN relay — so the rtc_relay_log table fills
   only with meaningful signal, not noise.
   Called automatically on connectionState === 'connected'. */
async function logRelayUsage(peerConn, context, contextId, callTypeStr){
  try {
    const stats = await peerConn.getStats();
    let localType = null, remoteType = null;
    // Walk stats to find the succeeded candidate-pair and its candidate types
    stats.forEach(report => {
      if(report.type === 'candidate-pair' && report.state === 'succeeded' && report.nominated){
        const local  = stats.get(report.localCandidateId);
        const remote = stats.get(report.remoteCandidateId);
        if(local)  localType  = local.candidateType;   // 'host' | 'srflx' | 'relay'
        if(remote) remoteType = remote.candidateType;
      }
    });
    if(!localType) return; // stats not available yet — skip silently
    const usedRelay = localType === 'relay' || remoteType === 'relay';
    // Only write to Supabase — no console noise in production
    await sb.from('rtc_relay_log').insert({
      user_id:          me.id,
      call_context:     context,
      context_id:       contextId,
      used_relay:       usedRelay,
      local_candidate:  localType,
      remote_candidate: remoteType,
      call_type:        callTypeStr,
      duration_seconds: null  // filled in by logCallOutcome separately
    });
  } catch(e) {
    // Never let relay logging break the actual call
    console.warn('relay stat log failed (non-fatal):', e);
  }
}

async function logCallOutcome(status, duration){
  // Only the caller writes the canonical log row for a call, so the two
  // sides never produce duplicate "Outgoing/Incoming Call" entries.
  if(!iWasCaller) return;
  await sb.from('dm_messages').insert({
    friendship_id: FID, sender_id: me.id, recipient_id: peer.id,
    kind: 'call_log', call_type: callType, call_status: status, call_duration_seconds: duration
  });
}

function teardownCall(){
  clearTimeout(ringTimeout);
  stopCallRingtone(); closeCallNotification();
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  if(pc){ pc.close(); pc=null; }
  callState = 'idle';
  iWasCaller = false;
  document.getElementById('callOverlay').classList.remove('show');
}

window.addEventListener('beforeunload', () => { if(callState !== 'idle') sendCallSignal({ kind: 'end' }); });

init();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
